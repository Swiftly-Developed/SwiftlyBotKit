name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.1"]
    container: swift:${{ matrix.swift }}-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  integration:
    # Real-database tests: the migration, the recorder's inserts and the
    # dashboard's PostgreSQL-specific SQL. 13 is the oldest release tested.
    name: Integration (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "16"]
    container: swift:6.0-jammy
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: botkit
          POSTGRES_PASSWORD: botkit
          POSTGRES_DB: botkit
        options: >-
          --health-cmd "pg_isready -U botkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BOTKIT_TEST_DATABASE_URL: postgres://botkit:botkit@postgres:5432/botkit?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests
        run: swift test --filter SwiftlyBotKitIntegrationTests

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test

  example:
    name: Examples/QuickStart
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Build QuickStart
        run: swift build --package-path Examples/QuickStart

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Build DocC
        run: swift package generate-documentation --target SwiftlyBotKit --warnings-as-errors
